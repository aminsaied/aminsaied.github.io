name: Test deployment

on:
  push:
    branches:
      - staging/redesign
  pull_request:
    branches:
      - main
      - staging/redesign

permissions:
  contents: read

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aminsaied
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: aminsaied/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Check production build
        run: yarn check:production
      - name: Check preview build
        run: yarn check:preview